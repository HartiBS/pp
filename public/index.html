<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PP – Projektverwaltung</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function() {
      const theme = localStorage.getItem('pp-theme');
      if (theme === 'light') document.documentElement.classList.add('light');
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <div class="logo-icon">PP</div>
      <span>PROJEKTVERWALTUNG</span>
    </div>
    <nav>
      <a href="/design-vorschlaege/">🎨 Designvorschläge</a>
      <button id="theme-toggle" class="theme-toggle" title="Dark/Light Mode umschalten">🌙</button>
      <div id="user-box" hidden>
        <div class="user-avatar" id="user-avatar"></div>
        <span id="user-name"></span>
        <button id="profile-btn" class="btn-secondary">Profil</button>
        <button id="admin-btn" class="btn-secondary" hidden>Benutzerverwaltung</button>
        <button id="logout-btn">Abmelden</button>
      </div>
    </nav>
  </header>

  <main id="app">
    <section id="auth-view">
      <div class="auth-card">
        <div class="logo" style="justify-content:center; margin-bottom:1.8rem;">
          <div class="logo-icon">PP</div>
          <span>PROJEKTVERWALTUNG</span>
        </div>
        <h2>Anmelden</h2>
        <form id="login-form">
          <input type="email" name="email" placeholder="E-Mail" required>
          <input type="password" name="password" placeholder="Passwort" required>
          <button type="submit">Einloggen</button>
        </form>
        <h2>Registrieren</h2>
        <form id="register-form">
          <input type="text" name="name" placeholder="Name" required>
          <input type="email" name="email" placeholder="E-Mail" required>
          <input type="password" name="password" placeholder="Passwort" required>
          <button type="submit">Registrieren</button>
        </form>
        <p id="auth-error" class="error" hidden></p>
      </div>
    </section>

    <section id="dashboard-view" hidden>
      <div class="dashboard-header">
        <h2>Meine Projekte</h2>
        <button id="new-project-btn">+ Neues Projekt</button>
      </div>
      <form id="project-form" hidden>
        <input type="text" name="name" placeholder="Projektname" required>
        <textarea name="description" placeholder="Beschreibung"></textarea>
        <div style="display:flex; gap:0.75rem;">
          <button type="submit">Anlegen</button>
          <button type="button" id="cancel-project-btn" class="btn-secondary">Abbrechen</button>
        </div>
      </form>
      <ul id="project-list"></ul>
    </section>

    <section id="profile-view" hidden>
      <button id="profile-back-btn">← Zurück</button>
      <h2>Profil bearbeiten</h2>
      <form id="profile-form">
        <label>Name <input type="text" name="name" required></label>
        <label>E-Mail <input type="email" name="email" required></label>
        <h3>Passwort ändern</h3>
        <label>Aktuelles Passwort <input type="password" name="currentPassword"></label>
        <label>Neues Passwort <input type="password" name="newPassword"></label>
        <button type="submit">Speichern</button>
      </form>
      <p id="profile-msg"></p>
    </section>

    <section id="admin-view" hidden>
      <button id="admin-back-btn">← Zurück</button>
      <div class="dashboard-header">
        <h2>Benutzerverwaltung</h2>
        <button id="new-user-btn">+ Neuer Benutzer</button>
      </div>
      <form id="user-form" hidden>
        <input type="hidden" name="id">
        <label>Name <input type="text" name="name" required></label>
        <label>E-Mail <input type="email" name="email" required></label>
        <label>Passwort <input type="password" name="password" placeholder="(beim Bearbeiten leer lassen)"></label>
        <label>Rolle
          <select name="role">
            <option value="admin">Admin</option>
            <option value="projektmanager">Projektmanager</option>
            <option value="entwickler">Entwickler</option>
            <option value="beobachter">Beobachter</option>
          </select>
        </label>
        <label>Aktiv <input type="checkbox" name="is_active" checked></label>
        <button type="submit">Speichern</button>
        <button type="button" id="cancel-user-btn" class="btn-secondary">Abbrechen</button>
      </form>
      <table id="user-table">
        <thead>
          <tr><th>Name</th><th>E-Mail</th><th>Rolle</th><th>Status</th><th>Aktionen</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="project-detail-view" hidden>
      <button id="back-btn">← Zurück</button>
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1.5rem;">
        <div>
          <h2 id="detail-name"></h2>
          <p id="detail-description"></p>
        </div>
        <span id="detail-status" class="badge"></span>
      </div>
      <div style="margin-bottom:1.5rem;">
        <h3>Team <span id="my-role-badge" class="badge"></span></h3>
        <div id="members-block">
          <ul id="member-list"></ul>
          <form id="member-form" hidden>
            <select name="user_id" id="member-user-select" required></select>
            <select name="role" required>
              <option value="projektmanager">Projektmanager</option>
              <option value="entwickler">Entwickler</option>
              <option value="beobachter">Beobachter</option>
            </select>
            <button type="submit">+ Mitglied hinzufügen</button>
            <button type="button" id="cancel-member-btn" class="btn-secondary">Abbrechen</button>
          </form>
          <button id="add-member-btn">+ Mitglied hinzufügen</button>
        </div>
      </div>
      <h3>Tasks</h3>
      <form id="task-form">
        <input type="text" name="title" placeholder="Neuen Task eingeben..." required>
        <button type="submit">+ Hinzufügen</button>
      </form>
      <ul id="task-list"></ul>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
