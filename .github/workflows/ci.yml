name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Syntax-Check aller JS-Dateien (kein Test-Framework nötig)
      - run: |
          find src public/js -name "*.js" -print0 | xargs -0 -n1 node --check

      # Abhängigkeiten auf bekannte Schwachstellen prüfen
      - run: npm audit --audit-level=high