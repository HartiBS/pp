name: Migrations

on:
  push:
    branches: [main]
    paths: ["db/migrations/**"]
  pull_request:
    paths: ["db/migrations/**"]

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pp
          POSTGRES_PASSWORD: pp
          POSTGRES_DB: pp_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run migrate
        env:
          DATABASE_URL: postgres://pp:pp@localhost:5432/pp_test