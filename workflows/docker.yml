name: Docker

on:
  push:
    branches: [main]
    paths: ["docker/**"]
  pull_request:
    paths: ["docker/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false